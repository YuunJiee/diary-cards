<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diary Cards 預覽</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* 模擬 Obsidian 的主題變數 */
  :root {
    --background-primary: #ffffff; --background-primary-alt: #f7f7f8; --background-secondary: #f3f4f6;
    --background-modifier-border: #e5e7eb; --background-modifier-hover: rgba(0,0,0,.05);
    --text-normal: #1f2328; --text-muted: #6b7280; --text-faint: #a1a1aa;
    --interactive-accent: #3b82f6; --text-on-accent: #fff;
  }
  body.theme-dark {
    --background-primary: #1e1e1e; --background-primary-alt: #242424; --background-secondary: #262626;
    --background-modifier-border: #3a3a3a; --background-modifier-hover: rgba(255,255,255,.06);
    --text-normal: #dcddde; --text-muted: #999; --text-faint: #666;
  }
  /* 模擬 Obsidian 對 button 的預設樣式（不換行、置中），讓預覽能抓到同樣的問題 */
  button {
    display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap; text-align: center; font-weight: 500;
    padding: 4px 12px; border-radius: 4px; background: #eee; box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  #app { height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script>if (location.hash === "#dark") document.body.classList.add("theme-dark");</script>
<script>
  // 模擬 Obsidian 手機版底部的浮動工具列：網址加 #mobile
  if (location.hash === "#mobile") {
    const nav = document.createElement("div");
    nav.className = "mobile-navbar";
    nav.style.cssText = "position:fixed;left:40px;right:40px;bottom:14px;height:64px;border-radius:32px;background:rgba(255,255,255,.92);box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:100";
    document.body.appendChild(nav);
  }
</script>
<script>
  // Obsidian 會提供這幾個全域函式，預覽頁沒有 Obsidian，先補上簡易版本
  window.activeDocument = document;
  window.createEl = (tag) => document.createElement(tag);
  Node.prototype.instanceOf = function (type) { return this instanceof type; };
</script>
<script src="dist/preview.js"></script>
</body>
</html>
